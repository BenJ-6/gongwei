<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工位 · 待办清单设计预览</title>
<style>
  :root {
    color-scheme: light;
    --canvas: #f7f5fc;
    --surface: #fff;
    --ink: #221936;
    --muted: #706680;
    --line: #eee9f5;
    --purple: #6338df;
    --purple-ink: #542abf;
    --purple-soft: #eee8ff;
    --lime: #e9fa9d;
    font: 14px "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif;
    color: var(--ink);
    background: var(--canvas);
  }
  *, *::before, *::after { box-sizing: border-box; }
  body, h1, h2, h3, p { margin: 0; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; }
  :focus-visible { outline: 2px solid var(--purple); outline-offset: 3px; }
  input::placeholder { opacity: 1; color: var(--muted); }
  svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .icon-library, .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .app { display: grid; grid-template-columns: 208px minmax(0, 1fr); min-height: 100vh; }
  .sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 26px 16px 20px; background: #fcfbff; border-right: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 11px; margin: 0 8px 41px; }
  .brand-mark { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 13px; color: white; background: var(--purple); box-shadow: 0 4px 10px #653ae43d; }
  .brand-mark svg { width: 23px; height: 23px; }
  .brand strong { display: block; font-size: 19px; line-height: 1.2; letter-spacing: .06em; }
  .brand small { font-size: 10px; font-weight: 650; letter-spacing: .14em; color: var(--muted); }
  .nav-label { margin: 0 10px 9px; color: var(--muted); font-size: 11px; }
  .nav-label:not(:first-child) { margin-top: 23px; }
  .nav-link { display: flex; align-items: center; gap: 9px; width: 100%; min-height: 42px; padding: 0 10px; border: 0; border-radius: 10px; margin: 3px 0; background: none; text-decoration: none; color: var(--muted); font-size: 13px; }
  .nav-link.current { color: var(--purple-ink); background: var(--purple-soft); font-weight: 700; }
  .nav-link.current:hover { background: #e8ddff; }
  .nav-link small, .nav-count { margin-left: auto; white-space: nowrap; font-size: 10px; }
  .nav-count { min-width: 23px; padding: 2px 4px; text-align: center; border-radius: 6px; background: white; }
  .sidebar-footer { margin-top: auto; padding: 16px 4px 0; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 9px; }
  .avatar { display: grid; place-items: center; width: 34px; height: 34px; flex: none; border-radius: 50%; color: #4f2aab; background: #e9e0ff; font-size: 11px; font-weight: 750; }
  .sidebar-footer strong { font-size: 12px; }
  .sidebar-footer p { margin-top: 3px; color: var(--muted); font-size: 10px; }
  main { min-width: 0; }
  .topbar { height: 63px; border-bottom: 1px solid var(--line); background: #fcfbff; }
  .topbar-inner, .content { width: min(100% - 72px, 1160px); margin-inline: auto; }
  .topbar-inner { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .breadcrumb { display: flex; align-items: center; gap: 7px; white-space: nowrap; font-size: 12px; color: var(--muted); }
  .breadcrumb svg { width: 13px; height: 13px; }
  .breadcrumb strong { color: var(--ink); }
  .search { display: flex; align-items: center; gap: 8px; width: 244px; padding: 6px 9px 6px 11px; border: 1px solid #e8e1f1; border-radius: 9px; background: var(--surface); color: var(--muted); }
  .search svg { width: 15px; height: 15px; }
  .search input { width: 100%; min-width: 0; padding: 2px 0; border: 0; outline: none; background: transparent; color: var(--ink); font-size: 12px; }
  .search:focus-within, .composer:focus-within { border-color: #ac95ef; box-shadow: 0 0 0 3px var(--purple-soft); }
  kbd { display: inline-grid; place-items: center; min-width: 18px; padding: 1px 4px; border: 1px solid #e9e2f3; border-radius: 5px; background: #fcfaff; color: var(--muted); font: 11px/1.35 "Segoe UI", sans-serif; }
  .content { padding: 28px 0 24px; }
  .heading { display: flex; align-items: end; justify-content: space-between; gap: 10px; margin-bottom: 21px; }
  .date-line { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; color: var(--purple-ink); font-size: 12px; font-weight: 650; }
  .date-line svg { width: 15px; height: 15px; }
  h1 { font-size: clamp(31px, 3vw, 43px); line-height: 1.18; letter-spacing: -.045em; font-weight: 760; }
  .primary { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 39px; padding: 0 13px; border: 0; border-radius: 9px; font-size: 13px; font-weight: 650; white-space: nowrap; color: white; background: var(--purple); box-shadow: 0 3px 7px #4c27a72b; }
  .primary:hover { background: #5328cb; }
  .primary svg { width: 16px; height: 16px; }
  .heading kbd { background: #ffffff24; color: #fff; border-color: #ffffff42; }
  .overview { display: grid; grid-template-columns: minmax(0, 2.1fr) repeat(2, minmax(0, 1fr)); gap: 13px; margin-bottom: 16px; }
  .card { position: relative; min-height: 168px; overflow: hidden; border-radius: 20px; }
  .progress-card { display: flex; align-items: center; justify-content: space-between; gap: 16px; isolation: isolate; padding: 18px clamp(18px, 2.3vw, 31px); color: #fff; background: linear-gradient(112deg, #261747, #412472 65%, #563499); }
  .progress-card::before { content: ""; position: absolute; z-index: -1; top: 50%; right: -39px; translate: 0 -50%; width: 254px; aspect-ratio: 1; border-radius: 50%; border: 1px solid #d5bdff42; box-shadow: 0 0 0 24px #b894ff19, 0 0 0 49px #b894ff16, 0 0 0 74px #b894ff13; }
  .progress-card::after { content: ""; position: absolute; z-index: -1; width: 5px; height: 5px; right: 24px; top: 22px; border-radius: 50%; background: #d6c3fd; box-shadow: -160px 107px 0 -1px #b29de4, -134px -4px 0 -1px #fff, -191px 30px 0 -1px #cbaaff; }
  .metric-label { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 650; }
  .progress-card .metric-label { color: #eee0ff; }
  .metric-label svg { width: 16px; height: 16px; }
  .metric-number { display: flex; align-items: baseline; gap: 6px; margin: 5px 0 4px; font-size: 45px; font-weight: 740; line-height: 1.06; letter-spacing: -.055em; font-variant-numeric: tabular-nums; }
  .metric-number small { font-size: 13px; font-weight: 500; letter-spacing: normal; }
  .metric-note { font-size: 11px; line-height: 1.45; }
  .progress-card .metric-note, .progress-card small { color: #eadbfa; }
  .ring { --progress: 0%; position: relative; display: grid; place-items: center; flex: none; width: 108px; aspect-ratio: 1; border-radius: 50%; background: conic-gradient(var(--lime) var(--progress), #b799ec59 0); box-shadow: 0 0 0 9px #cbb4ff23; }
  .ring::before { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: #462a7c; }
  .ring span { z-index: 1; font-size: 27px; font-weight: 750; letter-spacing: -.04em; }
  .stat { display: flex; flex-direction: column; align-items: start; justify-content: center; padding: 14px clamp(14px, 1.8vw, 23px); border: 1px solid transparent; }
  .stat .metric-number { font-size: 36px; }
  .metric-icon { display: grid; place-items: center; width: 33px; height: 33px; margin-bottom: 8px; border-radius: 10px; }
  .pending { color: #352058; background: #eee8fc; border-color: #e9e0fa; }
  .pending .metric-icon { color: #6338bf; background: #e1d3fc; }
  .pending .metric-note { color: #645479; }
  .urgent { color: #622b30; background: #fff0eb; border-color: #f9e6df; }
  .urgent .metric-icon { color: #a6453c; background: #ffe0d8; }
  .urgent .metric-note { color: #865252; }
  .composer { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; align-items: center; gap: 8px; padding: 9px; margin-bottom: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
  .task-entry, .field { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .task-entry { padding: 0 5px; }
  .entry-icon { display: grid; place-items: center; width: 29px; height: 29px; flex: none; border-radius: 8px; background: #f0eaff; color: var(--purple-ink); }
  .task-entry input { min-width: 0; width: 100%; padding: 8px 0; outline: none; background: none; border: 0; }
  .field { min-height: 38px; padding: 0 8px; background: #f8f6fc; border: 1px solid #efeaf5; border-radius: 8px; color: var(--muted); }
  .field svg { width: 14px; height: 14px; }
  .field select, .field input { min-width: 0; border: 0; background: transparent; font-size: 12px; padding: 3px 0; }
  .field input { width: 122px; }
  .list-panel { overflow: hidden; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); box-shadow: 0 5px 20px #321b5507; }
  .list-header { padding: 15px 20px 0; }
  .list-header h2 { font-size: 19px; letter-spacing: -.025em; }
  .list-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; margin-top: 6px; }
  .filters { display: flex; gap: 15px; }
  .filter { display: flex; align-items: center; gap: 5px; padding: 8px 2px 10px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted); font-size: 12px; font-weight: 650; white-space: nowrap; }
  .filter[aria-pressed="true"] { color: var(--purple-ink); border-color: var(--purple); }
  .filter span { min-width: 18px; padding: 1px 4px; border-radius: 5px; text-align: center; font-size: 10px; background: #f3eff8; }
  .filter[aria-pressed="true"] span { background: var(--purple-soft); }
  .clear { display: inline-flex; align-items: center; gap: 5px; padding: 6px; border: 0; border-radius: 6px; background: none; color: var(--muted); font-size: 11px; }
  .clear svg { width: 13px; height: 13px; }
  .clear:disabled { opacity: .5; }
  .clear:hover:not(:disabled) { background: #fff1ee; color: #9e392d; }
  .columns, .task-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(84px, .24fr) minmax(96px, .29fr) 64px; align-items: center; gap: 12px; padding-inline: 20px; }
  .columns { padding-block: 8px; color: var(--muted); border-block: 1px solid #f0ecf5; background: #faf8fd; font-size: 11px; }
  .columns > :last-child { text-align: center; }
  .group-title { display: flex; align-items: center; gap: 7px; padding: 8px 20px 4px; color: var(--muted); font-size: 11px; font-weight: 650; }
  .group-title::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #a78af0; }
  .group-title.done::before { background: #6e9a78; }
  .group-title:not(:first-child) { border-top: 1px solid #f1edf6; }
  .task-row { min-height: 43px; padding-block: 4px; }
  .task-row + .task-row { border-top: 1px solid #f2eef6; }
  .task-row:hover, .task-row:focus-within { background: #fcfaff; }
  .task-name { display: flex; align-items: center; min-width: 0; gap: 10px; }
  .task-title { line-height: 1.45; overflow-wrap: anywhere; font-size: 13px; font-weight: 600; }
  .done .task-title { color: var(--muted); text-decoration: line-through; text-decoration-color: #a49ab4; }
  .toggle { width: 17px; height: 17px; flex: none; margin: 0; accent-color: var(--purple); cursor: pointer; }
  .pill, .due-label { display: inline-flex; width: fit-content; align-items: center; gap: 5px; white-space: nowrap; font-size: 11px; }
  .pill { padding: 3px 7px; border-radius: 6px; font-weight: 650; }
  .pill::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .8; }
  .pill.high { background: #ffebe7; color: #9b3d36; }
  .pill.normal { background: #efe9fd; color: #5938a2; }
  .pill.low { background: #eef4ea; color: #45624a; }
  .due-label { color: var(--muted); }
  .due-label svg { width: 13px; height: 13px; }
  .due-label.over { color: #a13d32; }
  .due-label.today { color: #87510b; }
  .actions { display: flex; justify-content: end; gap: 3px; }
  .icon-button { display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 7px; color: var(--muted); background: transparent; }
  .icon-button svg { width: 14px; height: 14px; }
  .icon-button:hover { background: var(--purple-soft); color: var(--purple-ink); }
  .icon-button.delete:hover { background: #ffebe7; color: #9b3d36; }
  .rename-input { width: 100%; min-width: 0; padding: 3px 6px; border: 1px solid #c0aaf6; border-radius: 5px; font-size: 13px; }
  .empty { display: grid; justify-items: center; gap: 7px; padding: 34px 12px; color: var(--muted); text-align: center; font-size: 12px; }
  .empty svg { width: 25px; height: 25px; color: var(--purple); }
  .empty strong { color: var(--ink); font-size: 14px; }
  .list-footer { display: flex; justify-content: space-between; align-items: center; gap: 5px 12px; flex-wrap: wrap; padding: 10px 20px; border-top: 1px solid #f1edf6; color: var(--muted); font-size: 11px; }
  .list-footer kbd { margin-inline: 8px 3px; }
  @media (max-width: 1050px) {
    .app { grid-template-columns: 180px minmax(0, 1fr); }
    .sidebar { padding-inline: 12px; }
    .topbar-inner, .content { width: calc(100% - 44px); }
    .ring { width: 89px; }
  }
  @media (max-width: 850px) {
    .app { grid-template-columns: 65px minmax(0, 1fr); }
    .sidebar { padding: 20px 9px 16px; align-items: center; }
    .sidebar nav { width: 100%; }
    .sidebar .brand { margin: 0 0 23px; }
    .brand-text, .nav-label, .nav-link span, .nav-link small, .sidebar-footer div { display: none; }
    .nav-link { justify-content: center; padding: 0; }
    .sidebar-footer { padding-inline: 0; }
  }
  @media (max-width: 620px) {
    .app { display: block; }
    .sidebar { display: none; }
    .topbar { height: 55px; }
    .topbar-inner, .content { width: calc(100% - 28px); }
    .search { width: min(51%, 210px); }
    .search kbd, .heading kbd { display: none; }
    .content { padding-top: 20px; }
    .heading { margin-bottom: 15px; }
    .heading .primary { padding-inline: 9px; }
    .overview { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
    .card { min-height: 122px; border-radius: 15px; }
    .progress-card { grid-column: span 2; }
    .stat { padding: 10px 13px; }
    .metric-icon { width: 27px; height: 27px; margin-bottom: 5px; }
    .stat .metric-number { font-size: 27px; }
    .composer { grid-template-columns: 1fr 1.3fr auto; gap: 5px; margin-bottom: 12px; }
    .task-entry { grid-column: 1 / -1; }
    .field { padding-inline: 5px; }
    .field select, .field input { width: 100%; }
    .field svg { display: none; }
    .list-header, .group-title, .list-footer { padding-inline: 12px; }
    .filters { gap: 8px; }
    .columns { display: none; }
    .task-list { border-top: 1px solid var(--line); }
    .task-row { grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 7px; padding: 9px 12px; }
    .task-name { grid-column: 1 / 3; }
    .pill { grid-row: 2; grid-column: 1; margin-left: 27px; }
    .due-label { grid-row: 2; grid-column: 2; }
    .actions { grid-column: 3; grid-row: 1 / 3; }
  }
</style>
</head>
<body>
<svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <symbol id="i-brand" viewBox="0 0 24 24"><path d="M4 5h7v7H4zM13 12h7v7h-7zM15 5h5M17.5 2.5v5M4 16h5M4 19h5"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="m3 6 2 2 3-4m-5 9 2 2 3-4m-5 9 2 2 3-4M12 6h9m-9 7h9m-9 7h9"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18m-13 5h2m4 0h2"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M14 21H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10zm0 0v-6h6M8 8h8m-8 4h5"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16M8 4v4m8 2v4m-6 2v4"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-progress" viewBox="0 0 24 24"><path d="M3 19h18M5 15l5-5 4 3 6-8m-5 0h5v5"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M10 20a2 2 0 0 0 4 0M5 17h14l-2-3V9a5 5 0 0 0-10 0v5zM12 3v1"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4m0 1c6-4 8 4 14 0v9c-6 4-8-4-14 0"/></symbol>
  <symbol id="i-return" viewBox="0 0 24 24"><path d="M20 6v6a3 3 0 0 1-3 3H4m5-5-5 5 5 5"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="m14 5 5 5M4 20l4-1 12-12a2 2 0 0 0-3-3L5 16z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 6h16M9 6V3h6v3M6 6l1 14h10l1-14M10 10v6m4-6v6"/></symbol>
</svg>
<div class="app">
  <aside class="sidebar" aria-label="工位导航">
    <div class="brand">
      <span class="brand-mark"><svg aria-hidden="true"><use href="#i-brand"/></svg></span>
      <div class="brand-text"><strong>工位</strong><small>GONGWEI</small></div>
    </div>
    <nav aria-label="工作台模块">
      <p class="nav-label">日常</p>
      <a class="nav-link current" href="#main" aria-current="page" aria-label="待办清单" title="待办清单"><svg aria-hidden="true"><use href="#i-list"/></svg><span>待办清单</span><span class="nav-count" id="nav-count">0</span></a>
      <button class="nav-link" disabled aria-label="日程安排，待开放" title="日程安排 · 待开放"><svg aria-hidden="true"><use href="#i-calendar"/></svg><span>日程安排</span><small>待开放</small></button>
      <button class="nav-link" disabled aria-label="笔记便签，待开放" title="笔记便签 · 待开放"><svg aria-hidden="true"><use href="#i-note"/></svg><span>笔记便签</span><small>待开放</small></button>
      <p class="nav-label">工具</p>
      <button class="nav-link" disabled aria-label="设置，待开放" title="设置 · 待开放"><svg aria-hidden="true"><use href="#i-settings"/></svg><span>设置</span><small>待开放</small></button>
    </nav>
    <div class="sidebar-footer">
      <span class="avatar" aria-hidden="true">GW</span>
      <div><strong>我的工位</strong><p id="storage-note">预览数据保存在浏览器</p></div>
    </div>
  </aside>
  <main id="main">
    <div class="topbar">
      <div class="topbar-inner">
        <div class="breadcrumb"><span>工位</span><svg aria-hidden="true"><use href="#i-chevron"/></svg><strong>待办清单</strong></div>
        <label class="search">
          <svg aria-hidden="true"><use href="#i-search"/></svg>
          <input id="search" type="search" aria-label="搜索待办" placeholder="搜索待办…" autocomplete="off">
          <kbd aria-hidden="true">/</kbd>
        </label>
      </div>
    </div>
    <div class="content">
      <header class="heading">
        <div>
          <p class="date-line"><svg aria-hidden="true"><use href="#i-calendar"/></svg><time id="current-date"></time></p>
          <h1>待办清单</h1>
        </div>
        <button class="primary" id="new-task" type="button"><svg aria-hidden="true"><use href="#i-plus"/></svg>新建待办 <kbd aria-hidden="true">N</kbd></button>
      </header>
      <section class="overview" aria-label="任务概览">
        <article class="card progress-card">
          <div>
            <h2 class="metric-label"><svg aria-hidden="true"><use href="#i-progress"/></svg>整体完成度</h2>
            <p class="metric-number"><span id="completed-count">0</span><small id="total-count">/ 0 项</small></p>
            <p class="metric-note">已完成待办</p>
          </div>
          <div class="ring" id="progress-ring" role="progressbar" aria-label="整体完成度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progress-percent">0%</span></div>
        </article>
        <article class="card stat pending">
          <span class="metric-icon"><svg aria-hidden="true"><use href="#i-clock"/></svg></span>
          <h2 class="metric-label">待处理</h2>
          <p class="metric-number"><span id="pending-count">0</span><small>项</small></p>
          <p class="metric-note" id="pending-note">高优先级 0 项</p>
        </article>
        <article class="card stat urgent">
          <span class="metric-icon"><svg aria-hidden="true"><use href="#i-bell"/></svg></span>
          <h2 class="metric-label">需要关注</h2>
          <p class="metric-number"><span id="urgent-count">0</span><small>项</small></p>
          <p class="metric-note" id="urgent-note">今天到期 0 · 已逾期 0</p>
        </article>
      </section>
      <form id="composer" class="composer" aria-label="添加待办">
        <label class="task-entry"><span class="entry-icon"><svg aria-hidden="true"><use href="#i-plus"/></svg></span><input id="task-input" aria-label="待办标题" placeholder="写下一件要做的事…" autocomplete="off" required></label>
        <label class="field"><svg aria-hidden="true"><use href="#i-flag"/></svg><select id="task-priority" aria-label="优先级"><option value="high">高优先级</option><option value="normal" selected>普通</option><option value="low">低优先级</option></select></label>
        <label class="field"><svg aria-hidden="true"><use href="#i-calendar"/></svg><input id="task-due" type="date" aria-label="截止日期" title="截止日期（可选）"></label>
        <button class="primary" type="submit">添加<svg aria-hidden="true"><use href="#i-return"/></svg></button>
      </form>
      <section class="list-panel" aria-labelledby="list-heading">
        <header class="list-header">
          <h2 id="list-heading">我的任务</h2>
          <div class="list-toolbar">
            <div class="filters" aria-label="按状态筛选" role="group">
              <button type="button" class="filter" data-filter="all" aria-pressed="true">全部 <span id="filter-all">0</span></button>
              <button type="button" class="filter" data-filter="active" aria-pressed="false">进行中 <span id="filter-active">0</span></button>
              <button type="button" class="filter" data-filter="done" aria-pressed="false">已完成 <span id="filter-done">0</span></button>
            </div>
            <button type="button" class="clear" id="clear-completed" disabled><svg aria-hidden="true"><use href="#i-trash"/></svg>清除已完成</button>
          </div>
        </header>
        <div class="columns" aria-hidden="true"><span>任务名称</span><span>优先级</span><span>截止日期</span><span>操作</span></div>
        <div class="task-list" id="task-list"></div>
        <footer class="list-footer">
          <span id="list-summary"></span>
          <span>双击标题可重命名 <kbd>Enter</kbd> 添加</span>
        </footer>
      </section>
      <div class="sr-only" id="feedback" role="status"></div>
    </div>
  </main>
</div>
<template id="task-template">
  <div class="task-row" role="listitem">
    <div class="task-name"><input class="toggle" type="checkbox"><span class="task-title" title="双击重命名"></span></div>
    <span class="pill"></span>
    <span class="due-label"><svg aria-hidden="true"><use href="#i-calendar"/></svg><span></span></span>
    <div class="actions">
      <button class="icon-button edit" type="button" title="重命名"><svg aria-hidden="true"><use href="#i-edit"/></svg></button>
      <button class="icon-button delete" type="button" title="删除"><svg aria-hidden="true"><use href="#i-trash"/></svg></button>
    </div>
  </div>
</template>
<script>
  const get = (id) => document.getElementById(id);
  const setText = (id, value) => { get(id).textContent = value; };
  const storageKey = 'gongwei:preview:violet:v1';
  const priorityLabels = { high: '高优先级', normal: '普通', low: '低优先级' };
  const priorityOrder = { high: 0, normal: 1, low: 2 };
  const statusLabels = { active: '进行中', done: '已完成' };
  const filters = [...document.querySelectorAll('[data-filter]')];
  const composer = get('composer');
  const titleInput = get('task-input');
  const search = get('search');
  const taskList = get('task-list');
  let filter = 'all';
  let tasks = loadTasks();

  function dateKey(date = new Date()) {
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return `${date.getFullYear()}-${month}-${day}`;
  }

  function dateOffset(days) {
    const date = new Date();
    date.setDate(date.getDate() + days);
    return dateKey(date);
  }

  function seedTasks() {
    const now = Date.now();
    return [
      ['核对工位首页与待办流程', 'high', -1, false],
      ['敲定待办清单的交互细节', 'high', 0, false],
      ['整理桌面端功能需求', 'normal', 1, false],
      ['补齐窄屏布局检查', 'low', null, false],
      ['完成工位首页布局草图', 'normal', null, true],
      ['归档项目启动资料', 'low', null, true],
    ].map(([title, priority, days, done], index) => ({
      id: `demo-${index}`, title, priority, due: days === null ? '' : dateOffset(days),
      done, createdAt: now - index,
    }));
  }

  function loadTasks() {
    try {
      const saved = JSON.parse(localStorage.getItem(storageKey));
      if (Array.isArray(saved)) return saved;
    } catch {
      // Start with sample data if storage is unavailable or malformed.
    }
    const demo = seedTasks();
    saveTasks(demo);
    return demo;
  }

  function saveTasks(items) {
    try {
      localStorage.setItem(storageKey, JSON.stringify(items));
    } catch {
      setText('storage-note', '预览数据仅在当前页面保留');
    }
  }

  function updateTasks(next, message) {
    tasks = next;
    saveTasks(tasks);
    render();
    setText('feedback', message);
  }

  function getDueLabel(due, today) {
    if (!due) return { text: '—', tone: '' };
    const days = (Date.parse(due) - Date.parse(today)) / 86_400_000;
    if (days < 0) return { text: `逾期 ${-days} 天`, tone: 'over' };
    if (days === 0) return { text: '今天到期', tone: 'today' };
    if (days === 1) return { text: '明天到期', tone: '' };
    if (days === 2) return { text: '后天到期', tone: '' };
    if (days <= 7) return { text: `${days} 天后`, tone: '' };
    const [, month, day] = due.split('-').map(Number);
    return { text: `${month} 月 ${day} 日`, tone: '' };
  }

  function compareTasks(a, b) {
    return priorityOrder[a.priority] - priorityOrder[b.priority]
      || Number(!a.due) - Number(!b.due)
      || a.due.localeCompare(b.due)
      || b.createdAt - a.createdAt;
  }

  function renderOverview(counts, active, today) {
    const percent = counts.all ? Math.round(counts.done / counts.all * 100) : 0;
    const dueToday = active.filter((task) => task.due === today).length;
    const overdue = active.filter((task) => task.due && task.due < today).length;
    const high = active.filter((task) => task.priority === 'high').length;
    setText('completed-count', counts.done);
    setText('total-count', `/ ${counts.all} 项`);
    setText('progress-percent', `${percent}%`);
    get('progress-ring').style.setProperty('--progress', `${percent}%`);
    get('progress-ring').setAttribute('aria-valuenow', percent);
    setText('pending-count', counts.active);
    setText('pending-note', `高优先级 ${high} 项`);
    setText('nav-count', counts.active);
    setText('urgent-count', dueToday + overdue);
    setText('urgent-note', `今天到期 ${dueToday} · 已逾期 ${overdue}`);
  }

  function selectedFilter() {
    return filters.find((button) => button.dataset.filter === filter);
  }

  function focusRowAction(id, action) {
    const row = [...taskList.querySelectorAll('.task-row')].find((item) => item.dataset.id === id);
    (row?.querySelector(action) || selectedFilter()).focus({ preventScroll: true });
  }

  function labelTask(row, task) {
    row.querySelector('.toggle').setAttribute('aria-label', `${task.done ? '恢复待办' : '完成待办'}：${task.title}`);
    row.querySelector('.edit').setAttribute('aria-label', `重命名：${task.title}`);
    row.querySelector('.delete').setAttribute('aria-label', `删除：${task.title}`);
  }

  function renameTask(task, row, title) {
    if (!title.isConnected) return;
    const editor = document.createElement('input');
    editor.className = 'rename-input';
    editor.value = task.title;
    editor.setAttribute('aria-label', '重命名待办');
    let finished = false;
    function finish(save, returnFocus) {
      if (finished) return;
      finished = true;
      const name = editor.value.trim();
      editor.replaceWith(title);
      if (save && name && name !== task.title) {
        task.title = name;
        title.textContent = name;
        labelTask(row, task);
        saveTasks(tasks);
        setText('feedback', '已重命名待办');
        if (!matchesSearch(task)) render();
      }
      if (returnFocus) focusRowAction(task.id, '.edit');
    }
    editor.addEventListener('keydown', (event) => {
      if (event.isComposing || !['Enter', 'Escape'].includes(event.key)) return;
      event.preventDefault();
      finish(event.key === 'Enter', true);
    });
    editor.addEventListener('blur', () => finish(true, false));
    title.replaceWith(editor);
    editor.focus();
    editor.select();
  }

  function renderTask(task, today) {
    const row = get('task-template').content.firstElementChild.cloneNode(true);
    row.dataset.id = task.id;
    row.classList.toggle('done', task.done);
    const title = row.querySelector('.task-title');
    title.textContent = task.title;
    const toggle = row.querySelector('.toggle');
    toggle.checked = task.done;
    toggle.addEventListener('change', () => {
      task.done = toggle.checked;
      updateTasks(tasks, task.done ? '已完成待办' : '已恢复待办');
      focusRowAction(task.id, '.toggle');
    });
    const pill = row.querySelector('.pill');
    pill.textContent = priorityLabels[task.priority];
    pill.classList.add(task.priority);
    const due = row.querySelector('.due-label');
    const dueLabel = getDueLabel(task.due, today);
    due.lastElementChild.textContent = dueLabel.text;
    if (task.due) {
      due.title = task.due;
      if (!task.done && dueLabel.tone) due.classList.add(dueLabel.tone);
    } else {
      due.firstElementChild.remove();
      due.title = '无截止日期';
    }
    labelTask(row, task);
    row.querySelector('.edit').addEventListener('click', () => renameTask(task, row, title));
    title.addEventListener('dblclick', () => renameTask(task, row, title));
    row.querySelector('.delete').addEventListener('click', () => {
      const rows = [...taskList.querySelectorAll('.task-row')];
      const index = rows.indexOf(row);
      const next = rows[index + 1] || rows[index - 1];
      updateTasks(tasks.filter((item) => item.id !== task.id), '已删除待办');
      focusRowAction(next?.dataset.id, '.delete');
    });
    return row;
  }

  function matchesSearch(task) {
    return task.title.toLowerCase().includes(search.value.trim().toLowerCase());
  }

  function render() {
    const today = dateKey();
    const active = tasks.filter((task) => !task.done);
    const done = tasks.filter((task) => task.done);
    const counts = { all: tasks.length, active: active.length, done: done.length };
    renderOverview(counts, active, today);
    for (const button of filters) {
      const key = button.dataset.filter;
      button.setAttribute('aria-pressed', String(key === filter));
      setText(`filter-${key}`, counts[key]);
    }
    get('clear-completed').disabled = !counts.done;
    const groups = { active, done };
    const statuses = filter === 'all' ? ['active', 'done'] : [filter];
    const content = document.createDocumentFragment();
    let visible = 0;
    for (const status of statuses) {
      const items = groups[status].filter(matchesSearch).sort(compareTasks);
      if (!items.length) continue;
      visible += items.length;
      if (filter === 'all') {
        const heading = document.createElement('h3');
        heading.className = `group-title ${status}`;
        heading.textContent = `${statusLabels[status]} · ${items.length}`;
        content.append(heading);
      }
      const list = document.createElement('div');
      list.setAttribute('role', 'list');
      list.setAttribute('aria-label', statusLabels[status]);
      for (const task of items) list.append(renderTask(task, today));
      content.append(list);
    }
    if (!visible) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.innerHTML = '<svg aria-hidden="true"><use href="#i-list"/></svg><strong></strong><span></span>';
      empty.querySelector('strong').textContent = counts.all ? '没有匹配的待办' : '这里还没有待办';
      empty.querySelector('span').textContent = counts.all ? '试试其他关键词或筛选条件' : '写下第一件要做的事，按回车添加';
      content.append(empty);
    }
    taskList.replaceChildren(content);
    setText('list-summary', visible === counts.all ? `共 ${counts.all} 项` : `显示 ${visible} 项，共 ${counts.all} 项`);
  }

  titleInput.addEventListener('input', () => titleInput.setCustomValidity(''));
  composer.addEventListener('submit', (event) => {
    event.preventDefault();
    const title = titleInput.value.trim();
    if (!title) {
      titleInput.setCustomValidity('请输入待办标题');
      titleInput.reportValidity();
      return;
    }
    const task = {
      id: globalThis.crypto?.randomUUID?.() ?? `${Date.now()}-${Math.random().toString(36).slice(2)}`,
      title, priority: get('task-priority').value, due: get('task-due').value,
      done: false, createdAt: Date.now(),
    };
    if (filter === 'done') filter = 'all';
    if (!matchesSearch(task)) search.value = '';
    composer.reset();
    updateTasks([task, ...tasks], '已添加待办');
    titleInput.focus();
  });
  for (const button of filters) {
    button.addEventListener('click', () => {
      filter = button.dataset.filter;
      render();
    });
  }
  search.addEventListener('input', render);
  get('new-task').addEventListener('click', () => titleInput.focus());
  get('clear-completed').addEventListener('click', () => {
    updateTasks(tasks.filter((task) => !task.done), '已清除所有已完成待办');
    selectedFilter().focus({ preventScroll: true });
  });
  document.addEventListener('keydown', (event) => {
    if (event.defaultPrevented || event.metaKey || event.ctrlKey || event.altKey || event.isComposing
      || event.target.closest?.('input, select, textarea, [contenteditable]')) return;
    if (event.key === '/' || event.key.toLowerCase() === 'n') {
      event.preventDefault();
      (event.key === '/' ? search : titleInput).focus();
    }
  });
  const date = get('current-date');
  date.dateTime = dateKey();
  date.textContent = new Intl.DateTimeFormat('zh-CN', {
    year: 'numeric', month: 'long', day: 'numeric', weekday: 'long',
  }).format(new Date());
  render();
</script>
</body>
</html>
