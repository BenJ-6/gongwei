<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/gongwei.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>工位</title>
    <script>
      (() => {
        try {
          const rawMode = localStorage.getItem("gongwei:theme-mode");
          const rawAccent = localStorage.getItem("gongwei:theme-accent");
          const mode = ["light", "dark", "system"].includes(rawMode) ? rawMode : "system";
          const accent = ["violet", "blue", "mint", "amber"].includes(rawAccent) ? rawAccent : "violet";
          const dark = mode === "dark"
            || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.dataset.accent = accent;
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch {}
      })();
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
